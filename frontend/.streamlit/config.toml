[theme]
primaryColor = "#9C6B30"
backgroundColor = "#F7F6F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14181F"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"